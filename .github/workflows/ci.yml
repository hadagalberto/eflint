name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Source files are checked out as LF on both platforms (.gitattributes), and every
    # code-fix snapshot is verified with LF and CRLF input, so both jobs must agree.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EfLint.sln

      # Directory.Build.props enables warnings-as-errors for all projects. The sample's
      # WarningsNotAsErrors list is generated from the descriptors (guarded by
      # SampleWarningConfigurationTests), so even a direct -warnaserror build of the sample
      # keeps its intentional EFL diagnostics as warnings.
      - name: Build (warnings as errors)
        run: dotnet build -warnaserror

      - name: Test
        run: dotnet test --no-build --nologo

      - name: Pack
        run: dotnet pack src/EfLint.Package/EfLint.Package.csproj -c Release --nologo -o artifacts
